synopsis: 有害廃棄物の投棄場所にされている町トロマヴィル。ジムで清掃員として働く気弱な青年メルヴィンは、いじめっ子たちの悪ふざけで窓から転落し、毒の廃液が入ったドラム缶に落ちてしまう。醜い怪物の姿に変わった彼は、町にはびこる悪党たちを次々と退治していく。
