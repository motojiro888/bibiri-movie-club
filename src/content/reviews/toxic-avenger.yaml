verdict: 怖さはほぼゼロ。そのかわり悪趣味なゴアと容赦ない残酷描写がテンポよく畳みかけてくる。笑えるけど、笑っていいのか迷う場面も多いB級カルト映画。
fearCards:
  - icon: 😱
    title: びっくり度
    score: 1
    body: 驚かせる演出はほとんどない。怪物が暴れ回る場面も、怖がらせるというよりドタバタ劇のノリで進む。ジャンプスケアが苦手な人でもこの点は安心していい。
  - icon: 🩸
    title: グロ度
    score: 4
    body: 特殊メイクはチープなのに、やっていることはかなりエグい。人体が潰れる・ちぎれる系の描写が次々に出てくる。作り物感があるぶん直視はしやすいけど、子どもや弱者が標的になる場面もあり、むごさで言えば相当なもの。
  - icon: 🧠
    title: 精神ダメージ
    score: 2
    body: 全体は徹底的にバカバカしいので、深刻に落ち込むタイプではない。ただ悪党側の残虐さが妙に生々しく、ギャグの温度とのギャップで「うわ……」と引いてしまう瞬間が何度かある。
  - icon: 🌃
    title: 日常侵食度
    score: 1
    body: 現実味はゼロなので、観終わったあとに引きずることはまずない。残るのは毒々しい緑色のイメージくらい。
# timestamps: ユーザー視聴メモ「ほとんどない」に基づく
timestamps:
  - type: none
motojiroComment: 82分ずっと全力で悪ノリしていて、テンポのよさは本当にすごい。笑いながら観ていたのに、急に「いやそれはやりすぎでしょ……」と真顔になる瞬間が来るのがこの映画の怖いところ。<strong>面白いのは間違いないけど、犬と子どもの扱いがむごいので、そこが無理な人は避けたほうがいい。</strong>
fitOk:
  - B級映画やカルト映画が好き
  - 『ブレインデッド』みたいな悪ノリスプラッターが好き
  - チープな特殊メイクも味として楽しめる
  - テンポのいい映画をサクッと観たい
fitNg:
  - 動物が傷つく描写が苦手
  - 子どもが犠牲になる描写がつらい
  - 悪趣味な笑いが受けつけない
  - ちゃんと怖いホラーを期待している
